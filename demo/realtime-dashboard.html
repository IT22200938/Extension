<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA Real-Time Demo Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1419;
      color: #e6edf3;
      min-height: 100vh;
    }
    .header {
      padding: 1rem 1.5rem;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .header h1 { margin: 0; font-size: 1.25rem; }
    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .api-url {
      width: 280px;
      padding: 0.5rem 0.75rem;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #e6edf3;
      font-size: 0.875rem;
    }
    .status {
      font-size: 0.8rem;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      background: #21262d;
    }
    .status.live { color: #3fb950; }
    .status.error { color: #f85149; }
    .status.paused { color: #8b949e; }
    .main { padding: 1rem 1.5rem; max-width: 900px; margin: 0 auto; }
    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }
    .panel-header {
      padding: 0.75rem 1rem;
      background: #21262d;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-header .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      background: #30363d;
      border-radius: 4px;
    }
    .panel-body {
      padding: 1rem;
      max-height: 420px;
      overflow-y: auto;
      font-size: 0.85rem;
    }
    .entry {
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
    }
    .entry:last-child { margin-bottom: 0; }
    .entry-header {
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 0.5rem;
    }
    .entry pre {
      margin: 0;
      font-size: 0.75rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .entry .highlight { color: #58a6ff; }
    .entry .score { color: #3fb950; font-weight: 600; }
    .empty-state {
      color: #8b949e;
      text-align: center;
      padding: 2rem 1rem;
    }
    .meta { font-size: 0.7rem; color: #6e7681; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <header class="header">
    <h1>🔄 AURA Real-Time Demo Dashboard</h1>
    <div class="controls">
      <input type="url" id="apiBase" class="api-url" placeholder="https://mlpe.auraui.org/api" value="https://mlpe.auraui.org/api">
      <input type="password" id="authToken" class="api-url" placeholder="Auth token (from extension)" style="width: 200px;" title="Paste auth token from extension storage to show your data">
      <span id="status" class="status">Connecting...</span>
      <label><input type="checkbox" id="autoRefresh" checked> Auto-refresh</label>
    </div>
  </header>
  <main class="main">
    <section class="panel">
      <div class="panel-header">
        ML Response → Final Impairment Profile
        <span id="mlCount" class="badge">0</span>
      </div>
      <div class="panel-body" id="mlPanel">
        <div class="empty-state">Paste your auth token above, then complete the motor game. Your ML response and final impairment profile will appear here.</div>
      </div>
    </section>
  </main>
  <script>
    const apiBaseEl = document.getElementById('apiBase');
    const authTokenEl = document.getElementById('authToken');
    const statusEl = document.getElementById('status');
    const autoRefreshEl = document.getElementById('autoRefresh');
    const mlPanel = document.getElementById('mlPanel');
    const mlCountEl = document.getElementById('mlCount');

    function setStatus(cls, text) {
      statusEl.className = 'status ' + cls;
      statusEl.textContent = text;
    }

    async function fetchFeed() {
      const base = apiBaseEl.value.replace(/\/$/, '');
      const token = authTokenEl.value.trim();
      if (!token) return null;
      const res = await fetch(base + '/demo/feed', {
        headers: { 'Authorization': 'Bearer ' + token },
      });
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
      return res.json();
    }

    function renderML(responses) {
      if (!responses.length) {
        const hasToken = authTokenEl.value.trim();
        mlPanel.innerHTML = hasToken
          ? '<div class="empty-state">Complete the onboarding motor game. Your ML response and final impairment profile will appear here.</div>'
          : '<div class="empty-state">Paste your auth token above, then complete the motor game.</div>';
        mlCountEl.textContent = '0';
        return;
      }
      mlCountEl.textContent = responses.length;
      const r = responses[0];
      const imp = r.impairmentSnapshot || {};
      mlPanel.innerHTML = `
        <div class="entry">
          <div class="entry-header">${r.ts}</div>
          <div><span class="highlight">ML Response</span></div>
          <pre>${JSON.stringify(r.mlResponse, null, 2)}</pre>
          <div class="meta" style="margin-top: 1rem;"><span class="highlight">Final impairment profile</span> (saved)</div>
          <pre>${JSON.stringify(imp, null, 2)}</pre>
        </div>
      `;
    }

    async function poll() {
      if (!autoRefreshEl.checked) {
        setStatus('paused', 'Paused');
        return;
      }
      if (!authTokenEl.value.trim()) {
        setStatus('paused', 'Add token');
        renderML([]);
        return;
      }
      try {
        const feed = await fetchFeed();
        if (!feed) return;
        setStatus('live', 'Live • ' + (feed._meta?.updatedAt?.slice(11, 19) || 'OK'));
        renderML(feed.mlResponses || []);
      } catch (err) {
        setStatus('error', err.message || 'Fetch failed');
      }
    }

    autoRefreshEl.addEventListener('change', () => {
      if (autoRefreshEl.checked) poll();
    });
    apiBaseEl.addEventListener('change', poll);
    authTokenEl.addEventListener('input', poll);
    authTokenEl.addEventListener('change', poll);

    setInterval(poll, 2500);
    poll();
  </script>
</body>
</html>
